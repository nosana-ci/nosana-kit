stages:
  - test
  - build

include:
  - local: .gitlab/ci/common.yml

stake-program:npm format:
  stage: test
  script:
    - pnpm install --frozen-lockfile
    - pnpm --filter @nosana/stake-program run format
  rules:
    - if: $CI_MERGE_REQUEST_ID
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

stake-program:npm lint:
  stage: test
  script:
    - pnpm install --frozen-lockfile
    - pnpm --filter @nosana/stake-program run lint
  rules:
    - if: $CI_MERGE_REQUEST_ID
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

stake-program:npm test:
  stage: test
  script:
    - pnpm install --frozen-lockfile
    - pnpm --filter @nosana/stake-program run build:with-deps
    - pnpm --filter @nosana/stake-program run test
  rules:
    - if: $CI_MERGE_REQUEST_ID
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
