stages:
  - test
  - build
  - deploy

include:
  - local: .gitlab/ci/common.yml

jobs-program:npm format:
  stage: test
  script:
    - pnpm install --frozen-lockfile
    - pnpm --filter @nosana/jobs-program run format
  rules:
    - if: $CI_MERGE_REQUEST_ID
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

jobs-program:npm lint:
  stage: test
  script:
    - pnpm install --frozen-lockfile
    - pnpm --filter @nosana/jobs-program run lint
  rules:
    - if: $CI_MERGE_REQUEST_ID
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

jobs-program:npm test:
  stage: test
  script:
    - pnpm install --frozen-lockfile
    - pnpm --filter @nosana/jobs-program run build:with-deps
    - pnpm --filter @nosana/jobs-program run test
  rules:
    - if: $CI_MERGE_REQUEST_ID
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

jobs-program:npm publish prod:
  stage: deploy
  script:
    - sed -i "s/0.0.0/${CI_COMMIT_TAG:1}/" packages/generated_clients/jobs/package.json
    - pnpm install --frozen-lockfile
    - pnpm config set '//registry.npmjs.org/:_authToken' "${NPM_TOKEN}"
    - pnpm --filter @nosana/jobs-program run build:with-deps
    - pnpm --filter @nosana/jobs-program publish --access public --no-git-checks
  when: manual
  rules:
    - if: $CI_COMMIT_TAG && $CI_COMMIT_TAG != "latest"
