stages:
  - test
  - build

include:
  - local: .gitlab/ci/common.yml

pools-program:npm format:
  stage: test
  script:
    - pnpm install --frozen-lockfile
    - pnpm --filter @nosana/pools-program run format
  rules:
    - if: $CI_MERGE_REQUEST_ID
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

pools-program:npm lint:
  stage: test
  script:
    - pnpm install --frozen-lockfile
    - pnpm --filter @nosana/pools-program run lint
  rules:
    - if: $CI_MERGE_REQUEST_ID
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

pools-program:npm test:
  stage: test
  script:
    - pnpm install --frozen-lockfile
    - pnpm --filter @nosana/pools-program run build:with-deps
    - pnpm --filter @nosana/pools-program run test
  rules:
    - if: $CI_MERGE_REQUEST_ID
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
