<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nosana Connect — Demo</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, -apple-system, sans-serif;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f6f7f9;
      }
      main {
        width: 100%;
        max-width: 520px;
        margin: 1.5rem;
        padding: 2rem;
        background: #fff;
        border: 1px solid #e6e6e6;
        border-radius: 14px;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
      }
      h1 {
        margin: 0 0 0.25rem;
        font-size: 1.25rem;
      }
      p.lead {
        margin: 0 0 1.5rem;
        color: #666;
      }
      button {
        font: inherit;
        padding: 0.6rem 1rem;
        border: 0;
        border-radius: 8px;
        background: #111;
        color: #fff;
        cursor: pointer;
      }
      button.secondary {
        background: #eee;
        color: #111;
      }
      button + button {
        margin-left: 0.5rem;
      }
      pre {
        margin-top: 1rem;
        padding: 0.85rem 1rem;
        background: #0f1115;
        color: #d6e2ff;
        border-radius: 10px;
        overflow-x: auto;
        font-size: 0.8rem;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .error {
        color: #c0392b;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Connect with Nosana</h1>
      <p class="lead">A tiny demo of @nosana/kit — sign in, then call the API.</p>
      <div id="app">Loading…</div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
