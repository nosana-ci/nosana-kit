include:
  - local: .gitlab/ci/common.yml
  - project: nosana-ci/tools/cicd/gitlab-ci
    file: docker-container.yml

stages:
  - lint
  - build
  - test
  - deploy

variables:
  DOCKERFILE_DIR: ./packages/localnet/
  CONTAINER_PLATFORMS: linux/amd64
  REG_REPOSITORY: nosana/localnet

# Docker build/deploy jobs from docker-container.yml run in a Docker image without Node.js.
# Clear the inherited before_script (corepack/pnpm setup) at pipeline level,
# then re-add it explicitly on the Node.js jobs below.
before_script: []

.pnpm_before: &pnpm_before
  - corepack enable
  - npm install -g corepack@latest
  - corepack prepare pnpm@10.28.0 --activate

localnet:npm format:
  image: node:22.22.0
  stage: lint
  before_script: *pnpm_before
  script:
    - pnpm install --frozen-lockfile
    - pnpm --filter @nosana/localnet run format
  rules:
    - if: $CI_MERGE_REQUEST_ID
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

localnet:npm lint:
  image: node:22.22.0
  stage: lint
  before_script: *pnpm_before
  script:
    - pnpm install --frozen-lockfile
    - pnpm --filter @nosana/localnet run lint
  rules:
    - if: $CI_MERGE_REQUEST_ID
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

localnet:npm build:
  image: node:22.22.0
  stage: lint
  before_script: *pnpm_before
  script:
    - pnpm install --frozen-lockfile
    - pnpm --filter @nosana/localnet run build
  rules:
    - if: $CI_MERGE_REQUEST_ID
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
