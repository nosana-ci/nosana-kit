image: node:22.22.0

before_script:
  - corepack enable
  - npm install -g corepack@latest
  - corepack prepare pnpm@10.28.0 --activate

include:
  - project: nosana-ci/tools/cicd/gitlab-ci
    file: templates/semver.yml

check-generated-clients:
  stage: test
  script:
    - pnpm install --frozen-lockfile
    - pnpm run generate-clients
    - |
      if [ -n "$(git status --porcelain)" ]; then
        echo "❌ Generated clients are out of date. Please run 'npm run generate-clients' and commit the changes."
        git status
        git diff
        exit 1
      fi
      echo "✅ Generated clients are up to date."
  rules:
    - if: $CI_MERGE_REQUEST_ID
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

npm format:
  stage: test
  script:
    - pnpm install --frozen-lockfile
    - pnpm run format
  rules:
    - if: $CI_MERGE_REQUEST_ID
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

npm lint:
  stage: test
  script:
    - pnpm install --frozen-lockfile
    - pnpm run lint
  rules:
    - if: $CI_MERGE_REQUEST_ID
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

npm test:
  stage: test
  script:
    - pnpm install --frozen-lockfile
    - pnpm test
  rules:
    - if: $CI_MERGE_REQUEST_ID
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

npm test:localnet:
  stage: test
  image: docker:24.0.7
  before_script: []
  services:
    - name: docker:24.0.7-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    DOCKER_TLS_VERIFY: "0"
    DOCKER_CERT_PATH: ""
  script:
    - export DOCKER_TLS_CERTDIR=
    - export DOCKER_TLS_VERIFY=
    - export DOCKER_CERT_PATH=
    - apk add --no-cache nodejs npm
    - npm install -g pnpm@10.28.0
    - pnpm install --frozen-lockfile
    - pnpm test:localnet
  rules:
    - if: $CI_MERGE_REQUEST_ID
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

docs build:
  stage: build
  script:
    - sed -i "s/0.0.0/${CI_COMMIT_TAG:1}/" package.json
    - pnpm install --frozen-lockfile
    - pnpm run build
    - pnpm --filter @nosana/docs run build
  artifacts:
    paths:
      - docs/.vitepress/dist
    expire_in: 1 hour
  rules:
    - if: $CI_MERGE_REQUEST_ID
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG && $CI_COMMIT_TAG != "latest"

release:
  stage: deploy
  extends: .release
  before_script: []
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

npm publish prod:
  stage: deploy
  script:
    - sed -i "s/0.0.0/${CI_COMMIT_TAG:1}/" package.json
    - pnpm install --frozen-lockfile
    - pnpm config set '//registry.npmjs.org/:_authToken' "${NPM_TOKEN}"
    - pnpm run build
    - pnpm publish --access public --no-git-checks
  when: manual
  rules:
    - if: $CI_COMMIT_TAG && $CI_COMMIT_TAG != "latest"

pages:
  stage: deploy
  needs:
    - job: docs build
      artifacts: true
    - job: npm publish prod
  script:
    - mv docs/.vitepress/dist public
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_TAG && $CI_COMMIT_TAG != "latest"