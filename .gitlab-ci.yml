image: node:22.22.0

stages:
  - test
  - trigger
  - deploy

variables:
  GIT_STRATEGY: fetch
  GIT_DEPTH: "0"
  KIT_CHANGED: "0"
  DOCS_CHANGED: "0"

.pnpm_setup: &pnpm_setup
  - corepack enable
  - npm install -g corepack@latest
  - corepack prepare pnpm@10.28.0 --activate

before_script: *pnpm_setup

.pipeline_rules: &pipeline_rules
  - if: $CI_MERGE_REQUEST_ID
  - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  - if: $CI_COMMIT_TAG && $CI_COMMIT_TAG != "latest"

include:
  - local: .gitlab/ci/release.yml
  - local: .gitlab/ci/generated-clients.yml

detect-changes:
  stage: trigger
  needs:
    - job: check-generated-clients
  script:
    - bash .gitlab/ci/detect-changes.sh
  artifacts:
    paths:
      - child-*.yml
    expire_in: 1 hour
    reports:
      dotenv: changes.env
  rules: *pipeline_rules

trigger:packages-kit:
  stage: trigger
  needs:
    - job: detect-changes
      artifacts: true
  trigger:
    include:
      - artifact: child-packages-kit.yml
        job: detect-changes
    strategy: depend
  rules:
    - if: $CI_MERGE_REQUEST_ID && $KIT_CHANGED == "1"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $KIT_CHANGED == "1"
    - if: $CI_COMMIT_TAG && $CI_COMMIT_TAG != "latest" && $KIT_CHANGED == "1"

trigger:docs:
  stage: trigger
  needs:
    - job: detect-changes
      artifacts: true
  trigger:
    include:
      - artifact: child-docs.yml
        job: detect-changes
    strategy: depend
  rules:
    - if: $CI_MERGE_REQUEST_ID && $DOCS_CHANGED == "1"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $DOCS_CHANGED == "1"
    - if: $CI_COMMIT_TAG && $CI_COMMIT_TAG != "latest" && $DOCS_CHANGED == "1"
