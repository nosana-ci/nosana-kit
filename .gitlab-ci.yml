image: node:22.22.0

stages:
  - test
  - trigger
  - deploy

variables:
  GIT_STRATEGY: fetch
  GIT_DEPTH: "0"

.pnpm_setup: &pnpm_setup
  - corepack enable
  - npm install -g corepack@latest
  - corepack prepare pnpm@10.28.0 --activate

before_script: *pnpm_setup

.pipeline_rules: &pipeline_rules
  - if: $CI_MERGE_REQUEST_ID
  - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  - if: $CI_COMMIT_TAG && $CI_COMMIT_TAG != "latest"

include:
  - local: .gitlab/ci/generated-clients.yml

detect-packages-changes:
  stage: trigger
  needs:
    - job: check-generated-clients
      optional: true
  script:
    - bash .gitlab/ci/detect-packages-changes.sh
  artifacts:
    paths:
      - orchestrator.yml
    expire_in: 1 hour
    reports:
      dotenv: changes.env
  rules: *pipeline_rules

run-packages-pipelines:
  stage: trigger
  needs:
    - job: detect-packages-changes
      artifacts: true
  trigger:
    include:
      - artifact: orchestrator.yml
        job: detect-packages-changes
    strategy: depend
    forward:
      pipeline_variables: true
  rules: *pipeline_rules

# On main: bump versions, Lerna commits, tags, and pushes (requires GIT_PUSH_TOKEN for Lerna's push).
# Manual so we don't deploy on every commit to main.
deploy:
  stage: deploy
  when: manual
  script:
    - git checkout -B $CI_COMMIT_BRANCH origin/$CI_COMMIT_BRANCH
    - pnpm install --frozen-lockfile
    - git config user.email "ci@nosana.com"
    - git config user.name "CI"
    - git remote set-url origin "https://oauth2:${GIT_PUSH_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
    - pnpm run version:force
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# When a tag is pushed (by deploy): publish those packages to npm (prepack builds each package).
lerna-publish:
  stage: deploy
  script:
    - pnpm install --frozen-lockfile
    - pnpm config set "//registry.npmjs.org/:_authToken" "${NPM_TOKEN}"
    - pnpm run publish
  rules:
    - if: $CI_COMMIT_TAG && $CI_COMMIT_TAG != "latest"
