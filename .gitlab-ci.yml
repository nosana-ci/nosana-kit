#   _ __   ___  ___  __ _ _ __   __ _
#  | '_ \ / _ \/ __|/ _` | '_ \ / _` |
#  | | | | (_) \__ \ (_| | | | | (_| |
#  |_| |_|\___/|___/\__,_|_| |_|\__,_|

image: node:22.22.0

# Skip branch pipeline for Lerna release commits (tag pipeline still runs for publish).
workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_MESSAGE =~ /^chore\(release\): publish /'
      when: never
    - if: $CI_MERGE_REQUEST_ID
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG && $CI_COMMIT_TAG != "latest"

stages:
  - test
  - trigger
  - deploy

variables:
  GIT_STRATEGY: fetch
  GIT_DEPTH: "0"
  GITHUB_REPO: nosana-kit # enables the github-release job on vX.Y.Z tags

.pnpm_setup: &pnpm_setup
  - corepack enable
  - npm install -g corepack@latest
  - corepack prepare pnpm@10.28.1 --activate

before_script: *pnpm_setup

.pipeline_rules: &pipeline_rules
  - if: $CI_MERGE_REQUEST_ID
  - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  - if: $CI_COMMIT_TAG && $CI_COMMIT_TAG != "latest"

include:
  - local: .gitlab/ci/generated-clients.yml
  - project: nosana-ci/tools/cicd/gitlab-ci
    file: templates/github-release.yml

detect-packages-changes:
  stage: trigger
  needs:
    - job: check-generated-clients
      optional: true
  script:
    - bash .gitlab/ci/detect-packages-changes.sh
  artifacts:
    paths:
      - orchestrator.yml
    expire_in: 2 hours
    reports:
      dotenv: changes.env
  rules: *pipeline_rules

run-packages-pipelines:
  stage: trigger
  needs:
    - job: detect-packages-changes
      artifacts: true
  trigger:
    include:
      - artifact: orchestrator.yml
        job: detect-packages-changes
    strategy: depend
    forward:
      pipeline_variables: true
  rules: *pipeline_rules

# On main: bump versions (patch/minor/major), Lerna commits, tags, and pushes. One base job, variables avoid repetition.
.deploy:
  stage: deploy
  when: manual
  dependencies: []  # do not pull trigger-stage artifacts (we rm them anyway)
  variables:
    LERNA_BUMP: patch
    LERNA_FORCE: ""
  script:
    - git checkout -B $CI_COMMIT_BRANCH origin/$CI_COMMIT_BRANCH
    - pnpm install --frozen-lockfile
    - git config user.email "ci@nosana.com"
    - git config user.name "CI"
    - git remote set-url origin "https://bot:${GITLAB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
    - rm -f orchestrator.yml changes.env
    - pnpm exec lerna version $LERNA_BUMP --yes $LERNA_FORCE
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

deploy-patch:
  extends: .deploy

deploy-minor:
  extends: .deploy
  variables:
    LERNA_BUMP: minor

deploy-major:
  extends: .deploy
  variables:
    LERNA_BUMP: major

deploy-force:
  extends: .deploy
  variables:
    LERNA_FORCE: "--force-publish"

# When a tag is pushed (by deploy): publish those packages to npm.
# Build all packages from root first so dist/ exists before Lerna packs.
lerna-publish:
  stage: deploy
  dependencies: []  # do not pull artifacts from trigger stage (we don't need them)
  script:
    - pnpm install --frozen-lockfile
    - pnpm run build:packages
    - pnpm config set "//registry.npmjs.org/:_authToken" "${NPM_TOKEN}"
    - pnpm run publish
  rules:
    - if: $CI_COMMIT_TAG && $CI_COMMIT_TAG != "latest"

# Announce on GitHub, but only once the packages are actually live on npm.
github-release:
  extends: .github-release
  stage: deploy
  needs:
    - job: lerna-publish

mr-title-lint:
  extends: .mr-title-lint
  stage: test
