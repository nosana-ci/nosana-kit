image: node:22.22.0

stages:
  - test
  - trigger
  - deploy

variables:
  GIT_STRATEGY: fetch
  GIT_DEPTH: "0"
  KIT_CHANGED: "0"
  DOCS_CHANGED: "0"

.pnpm_setup: &pnpm_setup
  - corepack enable
  - npm install -g corepack@latest
  - corepack prepare pnpm@10.28.0 --activate

before_script: *pnpm_setup

.pipeline_rules: &pipeline_rules
  - if: $CI_MERGE_REQUEST_ID
  - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  - if: $CI_COMMIT_TAG && $CI_COMMIT_TAG != "latest"

include:
  - local: .gitlab/ci/release.yml
  - local: .gitlab/ci/generated-clients.yml

detect-changes:
  stage: trigger
  needs:
    - job: check-generated-clients
  script:
    - bash .gitlab/ci/detect-changes.sh
  artifacts:
    paths:
      - child-*.yml
      - orchestrator.yml
    expire_in: 1 hour
    reports:
      # Injects KIT_CHANGED, DOCS_CHANGED, etc. into jobs that need this job
      dotenv: changes.env
  rules: *pipeline_rules

# Single trigger: run orchestrator child. Its config is generated with KIT_CHANGED etc.
# baked in, so its trigger jobs are created correctly (rules run at pipeline creation).
# PARENT_PIPELINE_ID lets the orchestrator pull our detect-changes artifacts via needs:pipeline:job.
run-child-pipelines:
  stage: trigger
  needs:
    - job: detect-changes
      artifacts: true
  trigger:
    include:
      - artifact: orchestrator.yml
        job: detect-changes
    strategy: depend
  variables:
    PARENT_PIPELINE_ID: $CI_PIPELINE_ID
  rules: *pipeline_rules
