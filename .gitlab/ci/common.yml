image: node:22.22.0

.pnpm_setup: &pnpm_setup
  - corepack enable
  - npm install -g corepack@latest
  - corepack prepare pnpm@10.28.1 --activate

before_script: *pnpm_setup

# Tag pipelines: publishing is done from root (lerna-publish). This job keeps the child pipeline valid.
noop-tag:
  stage: test
  script: echo "Tag pipeline; npm publishing is done from root (lerna)."
  rules:
    - if: $CI_COMMIT_TAG && $CI_COMMIT_TAG != "latest"
