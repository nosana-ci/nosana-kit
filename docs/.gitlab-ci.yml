stages:
  - test
  - build
  - deploy

include:
  - local: .gitlab/ci/common.yml

docs:build:
  stage: build
  script:
    - sed -i "s/0.0.0/${CI_COMMIT_TAG:1}/" packages/kit/package.json
    - pnpm install --frozen-lockfile
    - pnpm --filter @nosana/kit run build:with-deps
    - pnpm --filter @nosana/docs run build
  artifacts:
    paths:
      - docs/.vitepress/dist
    expire_in: 1 hour
  rules:
    - if: $CI_MERGE_REQUEST_ID
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG && $CI_COMMIT_TAG != "latest"

pages:
  stage: deploy
  needs:
    - job: docs:build
      artifacts: true
  script:
    - mv docs/.vitepress/dist public
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_TAG && $CI_COMMIT_TAG != "latest"
